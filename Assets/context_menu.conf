# 右键菜单（context_menu 脚本）外观：与「MPV 简单设置」同一套墨绿 + 薄荷
#
# 菜单背景色不在这里——脚本取的是 --osd-outline-color（border-style 为
# background-box 时取 --osd-back-color），文字色取 --osd-color，
# 都在 mpv.conf 里统一设置，这样普通 OSD 与菜单是同一个色系。

font_size=14
padding_x=10
padding_y=6
corner_radius=8

# 0 = 不透明（和设置程序的卡片一样实心）；想透出画面就调到 0x40 附近
background_alpha=0

# 菜单外框：设置程序卡片的描边色，1.5px 约等于它的 1px
menu_outline_size=1.5
menu_outline_color=#435A40

# 当前项：薄荷底 + 墨绿字（对应设置程序的主按钮）
focused_color=#131F11
focused_back_color=#A3F6BE

disabled_color=#7F9285
